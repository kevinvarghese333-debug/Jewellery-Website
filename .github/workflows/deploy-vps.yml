name: Deploy static site to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kavitha-jewellery-production-deployment
  cancel-in-progress: false

env:
  DEPLOY_DIRECTORY: /var/www/kavitha-jewellery
  WEBSITE_CONTAINER: kavitha-jewellery-website-1
  WEBSITE_PORT: "8088"

jobs:
  deploy:
    if: vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build production site
        run: |
          npm ci
          npm run lint
          npm run build
          test -s dist/index.html

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Verify deployment target
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            test -d '$DEPLOY_DIRECTORY'
            test -w '$DEPLOY_DIRECTORY'
            sudo /usr/bin/docker inspect --format '{{.State.Running}}' '$WEBSITE_CONTAINER' | grep -qx true
          "

      - name: Upload production files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -az --delete-delay --delay-updates --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            dist/ "$VPS_USER@$VPS_HOST:$DEPLOY_DIRECTORY/"

      - name: Verify deployed website
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "
            set -euo pipefail
            test -s '$DEPLOY_DIRECTORY/index.html'
            find '$DEPLOY_DIRECTORY/assets' -type f -name '*.js' -print -quit | grep -q .
            sudo /usr/bin/docker inspect --format '{{.State.Running}}' '$WEBSITE_CONTAINER' | grep -qx true
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:$WEBSITE_PORT/ > /dev/null
            curl --fail --silent --show-error --max-time 10 http://127.0.0.1:$WEBSITE_PORT/spa-routing-check > /dev/null
          "
